# Offline tests on every push and pull request (D46). No secrets, no database, no API.
# SKIP_DB_TESTS=1 skips only the tests marked @needs_db (they need the full SMARD database);
# everything else runs, and any failing test fails the job.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SKIP_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned packages
        run: pip install -r requirements.txt

      - name: App tests
        run: python -m unittest discover -s app/tests

      - name: Grader tests
        if: ${{ !cancelled() }}   # run them even if the app tests failed, so one run shows everything
        run: python -m unittest discover -s grader/tests
