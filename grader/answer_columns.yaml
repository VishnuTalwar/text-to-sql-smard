# Answer columns for the answer-correctness score (D40 step 4), DRAFT for review, 2026-11-06.
# One entry per gold item that has SQL (76). Drafted from the question text and the gold SQL / gold result
# columns only; written blind to every agent answer. gold_set_smard.yaml is not changed (so its hash is not).
# Rules: results/answer_columns_rules_2026-11-06.md.
#
# required:     columns (by their gold column names) that an answer must contain.
# alternatives: only where the question is honestly ambiguous between two measures (rule 6). An answer
#               counts if it contains all of `required`, OR all columns of any one list in `alternatives`.
# label_only:  (D42) gold columns whose values are string literals written in the gold SQL (CASE ... THEN 'viel Solar'),
#               found from the gold SQL alone. They only have to group the rows the same way (a consistent one-to-one
#               renaming), not carry the same text.
# All other gold columns are optional: extra columns never hurt, they just are not required.
# label_meanings: (D43) for every label_only column, for every gold label, lowercase keywords or phrases that mean the same
#               (English and German). An agent label matches a gold label only if, after lowercasing and trimming, it contains
#               a keyword of exactly one gold label (whole words; longer phrases are checked first, so "not above" is read
#               before "above"). A label that matches none or both fails; the numbers next to a label must match that gold
#               label's row. Drafted blind (question text and gold labels only), before the answer score was re-graded.
# Review change (D42): t4_04 also accepts [beginn, ende] as an alternative, same as t4_02.
