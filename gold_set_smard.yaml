        WHERE metrik = 'grid load'
          AND zeitpunkt >= '2025-01-01' AND zeitpunkt < '2026-01-01'
      )
      SELECT ee.mwh AS erneuerbar_mwh, last.mwh AS netzlast_mwh,
             ROUND(100 * ee.mwh / last.mwh, 2) AS deckung_prozent
      FROM ee, last;
    gold_antwort: "erneuerbar_mwh=257 756 435.28, netzlast_mwh=465 817 685.81, deckung_prozent=55.33"
    hinweis: "Erneuerbare Erzeugung gegen Netzlast. Nicht identisch mit dem offiziellen EE-Anteil, der Im- und Export beruecksichtigt."

  - id: t3_08
    tier: 3
    frage: "Was power more expensive on weekends or on weekdays in 2025?"
    reihenfolge_relevant: true
    toleranz: 1.0e-06
    gold_zeilen: 2
    gold_sql: |
      SELECT CASE WHEN EXTRACT(ISODOW FROM zeitpunkt) >= 6 THEN 'Wochenende' ELSE 'Werktag' END AS typ,
             AVG(preis_eur_mwh) AS eur_mwh
      FROM preise
      WHERE preiszone = 'Deutschland/Luxemburg'
        AND zeitpunkt >= '2025-01-01' AND zeitpunkt < '2026-01-01'
      GROUP BY 1 ORDER BY eur_mwh DESC;
    gold_antwort: "Erste Zeilen: typ=Werktag, eur_mwh=96.21 EUR/MWh; typ=Wochenende, eur_mwh=72.03 EUR/MWh"
    hinweis: "Nur zwei Zeilen, aber die Reihenfolge IST die Antwort, deshalb reihenfolge_relevant: true."

  - id: t3_09
    tier: 3
    frage: "On the windiest day for onshore wind, what was the average German price?"
    reihenfolge_relevant: false
    toleranz: 1.0e-06
    gold_zeilen: 1
    gold_sql: |
      WITH windigster_tag AS (
        SELECT zeitpunkt::date AS tag
        FROM erzeugung WHERE energietraeger = 'Wind Onshore'
        GROUP BY 1 ORDER BY SUM(mwh) DESC LIMIT 1
      )
      SELECT w.tag, AVG(p.preis_eur_mwh) AS eur_mwh
      FROM preise p JOIN windigster_tag w ON p.zeitpunkt::date = w.tag
      WHERE p.preiszone = 'Deutschland/Luxemburg'
      GROUP BY w.tag;
    gold_antwort: "tag=2024-02-06, eur_mwh=45.29 EUR/MWh"

  - id: t3_10
    tier: 3
    frage: "Monat für Monat: wie hoch war der Sonnenstrom-Anteil an der Gesamterzeugung 2025?"
    reihenfolge_relevant: false
    toleranz: 1.0e-03
    gold_zeilen: 12
    gold_sql: |
      SELECT date_trunc('month', zeitpunkt)::date AS monat,
             ROUND(100 * SUM(mwh) FILTER (WHERE energietraeger = 'Photovoltaik') / SUM(mwh), 2) AS solaranteil_prozent
      FROM erzeugung
      WHERE zeitpunkt >= '2025-01-01' AND zeitpunkt < '2026-01-01'
      GROUP BY 1 ORDER BY 1;
    gold_antwort: "Erste Zeilen: monat=2025-01-01, solaranteil_prozent=3.84; monat=2025-02-01, solaranteil_prozent=8.03; monat=2025-03-01, solaranteil_prozent=18.32; ..."
    hinweis: "Deutsch ohne Schema-Literal: 'Sonnenstrom-Anteil' -> Photovoltaik als Anteil an SUM(mwh) aller Traeger."

  - id: t3_11
    tier: 3
    frage: "In 2025, was the price different in quarter-hours with a lot of solar, say above 5000 MWh, compared to the rest?"
    reihenfolge_relevant: false
    toleranz: 1.0e-06
    gold_zeilen: 2
    gold_sql: |
      WITH pv AS (
        SELECT zeitpunkt, mwh FROM erzeugung
        WHERE energietraeger = 'Photovoltaik'
          AND zeitpunkt >= '2025-01-01' AND zeitpunkt < '2026-01-01'
      )
      SELECT CASE WHEN pv.mwh > 5000 THEN 'viel Solar' ELSE 'wenig Solar' END AS gruppe,
             COUNT(*) AS n, AVG(p.preis_eur_mwh) AS eur_mwh
      FROM pv JOIN preise p ON p.zeitpunkt = pv.zeitpunkt AND p.preiszone = 'Deutschland/Luxemburg'
      GROUP BY 1 ORDER BY 1;
    gold_antwort: "Erste Zeilen: gruppe=viel Solar, n=6 592, eur_mwh=31.82 EUR/MWh; gruppe=wenig Solar, n=28 456, eur_mwh=102.62 EUR/MWh"
    hinweis: "Join ueber zeitpunkt zwischen erzeugung und preise. Die Schwelle ist MWh je Viertelstunde."

  - id: t3_12
    tier: 3
    frage: "Which day had the lowest total generation, and how far below the daily average was it?"
    reihenfolge_relevant: false
    toleranz: 1.0e-03
    gold_zeilen: 1
    gold_sql: |
      WITH tage AS (
        SELECT zeitpunkt::date AS tag, SUM(mwh) AS mwh FROM erzeugung GROUP BY 1
      )
      SELECT tag, mwh AS tages_mwh,
             ROUND(AVG(mwh) OVER (), 2) AS durchschnitt_mwh,
             ROUND(100 * (mwh - AVG(mwh) OVER ()) / AVG(mwh) OVER (), 2) AS abweichung_prozent
      FROM tage ORDER BY mwh ASC LIMIT 1;
    gold_antwort: "tag=2024-03-31, tages_mwh=744 586.25 MWh, durchschnitt_mwh=1 209 595.03, abweichung_prozent=-38.44"
    hinweis: "Achtung: der 2024-03-31 ist der Tag der Zeitumstellung und hat nur 23 Stunden. Die Antwort ist korrekt, aber teilweise ein Kalenderartefakt. Das ist Absicht, ein guter Agent sollte es idealerweise erwaehnen."

  - id: t4_01
    tier: 4
    frage: "For each week, which source was the top producer?"
    reihenfolge_relevant: false
    toleranz: 1.0e-06
    gold_zeilen: 158
    gold_sql: |
      WITH wochen AS (
        SELECT date_trunc('week', zeitpunkt)::date AS woche, energietraeger, SUM(mwh) AS mwh
        FROM erzeugung GROUP BY 1, 2
      ), rang AS (
        SELECT woche, energietraeger, mwh,
               ROW_NUMBER() OVER (PARTITION BY woche ORDER BY mwh DESC NULLS LAST) AS rn
        FROM wochen
      )
      SELECT woche, energietraeger, mwh FROM rang WHERE rn = 1 ORDER BY woche;
    gold_antwort: "Erste Zeilen: woche=2023-05-29, energietraeger=Photovoltaik, mwh=1 360 232.50 MWh; woche=2023-06-05, energietraeger=Photovoltaik, mwh=2 172 220.75 MWh; woche=2023-06-12, energietraeger=Photovoltaik, mwh=2 230 568.25 MWh; ..."
    hinweis: "date_trunc('week', ...) beginnt am Montag. Erste und letzte Woche des Datensatzes sind unvollstaendig. Reihenfolge kosmetisch, verglichen wird ueber den Schluessel woche."

  - id: t4_02
    tier: 4
    frage: "What was the longest unbroken stretch where solar output was zero?"
    reihenfolge_relevant: false
    toleranz: 1.0e-06
    gold_zeilen: 1
    gold_sql: |
      WITH pv AS (
        SELECT zeitpunkt, mwh,
               ROW_NUMBER() OVER (ORDER BY zeitpunkt) AS rn
        FROM erzeugung WHERE energietraeger = 'Photovoltaik'
      ), null_lauf AS (
        SELECT zeitpunkt, rn, rn - ROW_NUMBER() OVER (ORDER BY zeitpunkt) AS gruppe
        FROM pv WHERE mwh = 0
      )
      SELECT MIN(zeitpunkt) AS beginn, MAX(zeitpunkt) AS ende,
             COUNT(*) AS viertelstunden, ROUND(COUNT(*) / 4.0, 2) AS stunden
      FROM null_lauf
      GROUP BY gruppe
      ORDER BY viertelstunden DESC LIMIT 1;
    gold_antwort: "beginn=2026-06-01 00:00:00, ende=2026-06-01 04:00:00, viertelstunden=17, stunden=4.25"
    hinweis: "Wer stattdessen 'praktisch null' meint (mwh < 1), bekommt 54 Viertelstunden = 13.5 Stunden vom 2023-12-12 18:15 bis 2023-12-13 07:30. Beide Varianten sind vertretbar, die Frage ist bewusst woertlich genommen."
    fragil: true
    fragil_grund: "Gleiche Abhaengigkeit wie t1_30: exakt 0 gibt es nur am 2026-06-01. Bei einem Reload zuerst hier nachsehen, bevor du den Grader debuggst."

  - id: t4_03
    tier: 4
    frage: "Which hours had more generation than consumption?"
    reihenfolge_relevant: false
    toleranz: 1.0e-06
    gold_zeilen: 8568
    gold_sql: |
      WITH e AS (
        SELECT date_trunc('hour', zeitpunkt) AS stunde, SUM(mwh) AS erzeugt
        FROM erzeugung GROUP BY 1
      ), v AS (
        SELECT date_trunc('hour', zeitpunkt) AS stunde, SUM(mwh) AS verbraucht
        FROM verbrauch WHERE metrik = 'grid load' GROUP BY 1
      )
      SELECT e.stunde, e.erzeugt, v.verbraucht, e.erzeugt - v.verbraucht AS ueberschuss_mwh
      FROM e JOIN v USING (stunde)
      WHERE e.erzeugt > v.verbraucht
      ORDER BY e.stunde;
    gold_antwort: "Erste Zeilen: stunde=2023-06-01 10:00:00, erzeugt=59 921.25, verbraucht=59 728.75, ueberschuss_mwh=192.50 MWh; stunde=2023-06-01 11:00:00, erzeugt=63 158.25, verbraucht=60 081, ueberschuss_mwh=3 077.25 MWh; stunde=2023-06-01 12:00:00, erzeugt=64 757.50, verbraucht=60 041.25, ueberschuss_mwh=4 716.25 MWh; ..."
    hinweis: "Erzeugung inkl. Pumpspeicher-Rueckverstromung gegen Netzlast (ohne Pumpstrom). Auf Stundenebene aggregiert, je 4 Viertelstunden."

  - id: t4_04
    tier: 4
    frage: "What was the longest run of consecutive quarter-hours with a negative German price?"
    reihenfolge_relevant: false
    toleranz: 1.0e-06
    gold_zeilen: 1
    gold_sql: |
      WITH p AS (
        SELECT zeitpunkt, preis_eur_mwh,
               ROW_NUMBER() OVER (ORDER BY zeitpunkt) AS rn
        FROM preise WHERE preiszone = 'Deutschland/Luxemburg'
      ), neg AS (
        SELECT zeitpunkt, rn - ROW_NUMBER() OVER (ORDER BY zeitpunkt) AS gruppe
        FROM p WHERE preis_eur_mwh < 0
      )
      SELECT MIN(zeitpunkt) AS beginn, MAX(zeitpunkt) AS ende,
             COUNT(*) AS viertelstunden, ROUND(COUNT(*) / 4.0, 2) AS stunden
      FROM neg
      GROUP BY gruppe
      ORDER BY viertelstunden DESC LIMIT 1;
    gold_antwort: "beginn=2023-12-24 01:00:00, ende=2023-12-25 12:45:00, viertelstunden=144, stunden=36"
    hinweis: "144 Viertelstunden = 36 Stunden ueber Weihnachten 2023."

