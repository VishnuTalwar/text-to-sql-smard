# =====================================================================
# GOLD SET - Natural-Language Analytics Agent (SMARD / Strommarkt DE)
# =====================================================================
# 84 Eintraege: 35 x Tier 1, 25 x Tier 2, 12 x Tier 3, 4 x Tier 4,
#               8 x nicht beantwortbar (Tier 0).
#
# Jede gold_sql wurde gegen PostgreSQL 16 auf den echten geladenen Daten
# ausgefuehrt. gold_antwort ist das tatsaechliche Ergebnis.
#
# ---------------------------------------------------------------------
# SO WIRD BEWERTET  (bitte genau so implementieren)
# ---------------------------------------------------------------------
#  1. gold_antwort ist DOKUMENTATION, nicht die Wahrheit. Bei mehrzeiligen
#     Ergebnissen ist sie nach drei Zeilen abgeschnitten. Der Grader fuehrt
#     immer gold_sql aus und vergleicht Ergebnismenge gegen Ergebnismenge.
#     gold_zeilen gibt die erwartete Zeilenzahl an, als schneller Shape-Check.
#  2. Spalten werden ueber die POSITION verglichen, nie ueber den Namen.
#     Die Aliase hier (mwh, eur_mwh, n, stunde, monat) sind Konvention,
#     ein Agent schreibt total, sum, avg_price oder gar nichts.
#  3. Verglichen werden ROHWERTE. Formatierung erst bei der Ausgabe.
#     Tausendertrennzeichen zwischen Grader und Vergleich sind der Grund,
#     warum 2023 und "2 023" nicht matchen.
#  4. reihenfolge_relevant
#       false (Standard): Ergebnis als Menge vergleichen, Zeilenreihenfolge
#                         egal. Gilt auch fuer LIMIT-1-Items, die haben nur
#                         eine Zeile.
#       true            : Ergebnis als geordnete Liste vergleichen.
#     8 Items stehen auf true. t2_21 sagt zwar "sortiert", steht aber
#     bewusst auf false, siehe Hinweis dort.
#  5. toleranz gilt fuer numerische Zellen, relativ:
#       bestanden, wenn  abs(ist - soll) <= toleranz * max(abs(soll), 1)
#     Standard 1e-6. Auf 1e-3 angehoben bei den Items, deren gold_sql ein
#     ROUND() enthaelt, damit ein Agent, der an anderer Stelle rundet,
#     nicht wegen der letzten Nachkommastelle durchfaellt.
#  6. NULL ist nicht 0. Besonders bei Kernenergie, siehe unten.
#  7. Tier 0: bestanden, wenn der Agent sagt, dass die Frage mit diesen
#     Daten nicht beantwortbar ist. Eine Zahl auszugeben, auch die 0,
#     ist ein Durchfaller.
#  8. Einheiten bei Lastfragen: Lastfrage: Referenz ist MWh je Viertelstunde. Eine Antwort in MW oder GW gilt genau dann als korrekt, wenn sie dem Vierfachen entspricht UND die Einheit ausdruecklich genannt wird. Eine nackte Zahl ohne Einheit wird gegen den MWh-Wert geprueft.
#  9. Score IMMER pro Tier berichten. Tier 1 ist 42 Prozent aller Items und
#     folgt einem einzigen Muster (ein Aggregat, ein bis zwei Filter, kein
#     GROUP BY, kein Join). Eine Gesamtzahl wie "61 von 84" wird davon
#     geschmeichelt und sagt wenig aus.
#
# ---------------------------------------------------------------------
# SCHEMA
#   erzeugung (zeitpunkt timestamp, energietraeger text, mwh numeric)
#   verbrauch (zeitpunkt timestamp, metrik        text, mwh numeric)
#   preise    (zeitpunkt timestamp, preiszone     text, preis_eur_mwh numeric)
#
#   erzeugung.energietraeger:
#     Biomasse, Wasserkraft, Wind Offshore, Wind Onshore, Photovoltaik,
#     Sonstige Erneuerbare, Kernenergie, Braunkohle, Steinkohle, Erdgas,
#     Pumpspeicher, Sonstige Konventionelle
#   verbrauch.metrik (English, matching this table's source CSV -- the
#   English literals are used deliberately, see the note below):
#     grid load, Grid load incl. hydro pumped storage,
#     Hydro pumped storage, Residual load
#   preise.preiszone (exakte Literale, mit Umlauten):
#     Deutschland/Luxemburg, "∅ Anrainer DE/LU", Belgien, Dänemark 1,
#     Dänemark 2, Frankreich, Niederlande, Norwegen 2, Österreich, Polen,
#     Schweden 4, Schweiz, Tschechien, DE/AT/LU, Italien (Nord), Slowenien,
#     Ungarn
#
# ---------------------------------------------------------------------
# ABDECKUNG UND FALLSTRICKE
#   * Zeitraum: 2023-06-01 00:00 bis 2026-06-01 23:45, Viertelstundenwerte.
#     105 312 Zeitstempel je Serie.
#   * Werte sind Arbeit in MWh je Viertelstunde, keine Leistung. Fuer MW mal 4.
#   * Juni 2026 enthaelt nur EINEN Tag, Juli 2026 gar nichts. Deshalb
#     benutzen die Fragen 2024 und 2025.
#   * Kernenergie: Messwerte nur bis 2024-01-30, und die sind alle 0.
#     Danach durchgehend NULL. SUM(...) liefert dort NULL, nicht 0.
#   * Preiszone DE/AT/LU: existiert, ist aber im gesamten Zeitraum leer.
#   * Sommerzeit: an den drei Umstelltagen im Herbst (2023-10-29,
#     2024-10-27, 2025-10-26) gibt es je 4 doppelte Zeitstempel, insgesamt 12.
#     Die drei Fruehjahrstage haben nur 23 Stunden. Trifft t3_12 und alle
#     Luecken-Analysen.
#   * Zwei Items sind als fragil markiert (t1_30, t4_02). Sie haengen an
#     einem Datenartefakt des letzten Tages. Bei einem Reload zuerst dort
#     nachsehen, bevor du den Grader verdaechtigst.
#   * 11 Fragen sind auf Deutsch. Die meisten nennen das Schema-Wort bewusst
#     NICHT (Sonnenstrom, Kohle, Windkraft an Land, Gaskraftwerke,
#     Speicherkraftwerke, Oekostrom, Stromverbrauch), verlangen also echtes
#     Mapping und keinen String-Match.
#   * Die Metrik-Labels in verbrauch sind hier bewusst ENGLISCH (grid load,
#     Residual load, Hydro pumped storage, Grid load incl. hydro pumped
#     storage), weil die Quell-CSV englisch war und die Ladung diese Namen
#     unveraendert behalten hat -- anders als erzeugung/preise, die deutsch
#     sind. Alle 12 verbrauch-Fragen wurden entsprechend angepasst.
# =====================================================================

